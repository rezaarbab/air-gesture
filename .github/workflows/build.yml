name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore ci-release.jks -alias air \
            -keyalg RSA -keysize 2048 -validity 7300 \
            -storepass air-tmp-2026 -keypass air-tmp-2026 \
            -dname "CN=Air, O=Air, C=IR"

      - name: Build both flavors
        run: gradle :app:assembleProxRelease :app:assembleHandRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: air-gesture-prox-apk
          path: app/build/outputs/apk/prox/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: air-gesture-hand-apk
          path: app/build/outputs/apk/hand/release/*.apk
